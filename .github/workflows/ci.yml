name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  XCODE_MAJOR: "27" # preferred Xcode (README); the newest hosted Xcode is used when the image has none

jobs:
  build-test:
    name: Format, build, test
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the secret scan reads the whole history

      - name: Select Xcode ${{ env.XCODE_MAJOR }}
        run: |
          app="$(ls -d "/Applications/Xcode_${XCODE_MAJOR}"*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$app" ]; then
            # The template itself also builds with the newest hosted Xcode; products made from it pin their Xcode strictly.
            app="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
            echo "::warning::this runner image has no Xcode ${XCODE_MAJOR}; building with $(basename "$app" .app) instead."
          fi
          sudo xcode-select -s "$app"
          xcodebuild -version

      - name: Install XcodeGen
        run: command -v xcodegen > /dev/null || brew install xcodegen

      - name: Project is up to date
        run: |
          xcodegen generate --quiet
          git diff --exit-code -- '*.xcodeproj' || {
            echo "::error::project.yml changed but the generated project was not committed; run xcodegen generate"; exit 1; }

      - name: Format check
        run: xcrun swift-format lint --strict --recursive --parallel Template TemplateCore TemplateTests

      - name: Resolve packages (retried; the Sparkle binary download is occasionally refused)
        run: |
          for attempt in 1 2 3; do
            xcodebuild -resolvePackageDependencies -project Template.xcodeproj -scheme Template && exit 0
            echo "attempt $attempt failed; retrying in 20s"; sleep 20
          done
          exit 1

      - name: Script tests
        run: |
          scripts/test-release.sh

      - name: Secret scan of the history
        run: python3 scripts/scan_secrets.py

      - name: Build (Release)
        run: |
          set -o pipefail
          xcodebuild build -project Template.xcodeproj -scheme Template \
            -configuration Release -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO

      - name: Test
        # COMPAT_RUN=1 disables suites that need real sockets; the hosted image is unreliable for them.
        env:
          TEST_RUNNER_COMPAT_RUN: "1"
        run: |
          set -o pipefail
          xcodebuild test -project Template.xcodeproj -scheme Template \
            -destination 'platform=macOS' -testLanguage en -testRegion US CODE_SIGNING_ALLOWED=NO
