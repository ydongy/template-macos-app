# Documents must match the ydongy templates (handbook/core/docs.md).
name: Docs

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: ydongy/.github/.github/workflows/docs-check.yml@f61354c75725bf3688632a9d3040e5664046f81a
    with:
      handbook-ref: f61354c75725bf3688632a9d3040e5664046f81a
