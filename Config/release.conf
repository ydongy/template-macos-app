# Product settings for the release tooling (scripts/release.sh, release-credentials.sh, bump.sh,
# scan_secrets.py, website-changelog.py). scripts/init.sh rewrites these values when a repository is
# created from the template; after that this file is the only place with product names and domains.
#
# Plain KEY="value" lines: bash sources this file and Python parses it, so no expansions and one
# assignment per line.

# Scheme, target and app bundle name; also the prefix of the dmg (Template-1.0.0.dmg).
APP_NAME="Template"
PROJECT="Template.xcodeproj"
SCHEME="Template"

# Product domain, public site and the download host (Cloudflare R2: dmg, appcast.xml, latest.json).
PRODUCT_DOMAIN="example.com"
SITE_URL="https://example.com"
DOWNLOADS_URL="https://dl.example.com"

# Login-keychain items are named "<KEYCHAIN_PREFIX>-release-<NAME>"; the Sparkle EdDSA key is stored
# under the keychain account SPARKLE_ACCOUNT (generate_keys --account <name>).
KEYCHAIN_PREFIX="template"
SPARKLE_ACCOUNT="template"

REPO_URL="https://github.com/ydongy/template"

# Space separated strings that must not appear anywhere in the Release app (debug and preview types).
FORBID_SYMBOLS="MockExampleSource ExamplePreviewData"
